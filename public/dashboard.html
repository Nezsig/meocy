<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bookings — MEOCY Studio</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230a0a0a'/%3E%3Crect x='30' y='30' width='40' height='40' rx='10' fill='%237acc00'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        .dashboard-container {
            max-width: 1000px;
            margin: 80px auto 40px;
            padding: 0 20px;
        }

        .dashboard-header {
            margin-bottom: 40px;
        }

        .dashboard-header h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .email-display {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .bookings-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .booking-card {
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            background: var(--bg-secondary);
        }

        .booking-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 16px;
            gap: 12px;
        }

        .booking-id {
            font-family: 'Monaco', 'Courier New', monospace;
            font-size: 12px;
            color: var(--text-secondary);
            background: rgba(0, 0, 0, 0.05);
            padding: 4px 8px;
            border-radius: 4px;
        }

        .booking-status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 6px;
        }

        .status-pending {
            background: rgba(255, 193, 7, 0.1);
            color: #f57f17;
        }

        .status-completed {
            background: rgba(76, 175, 80, 0.1);
            color: #2e7d32;
        }

        .status-cancelled {
            background: rgba(244, 67, 54, 0.1);
            color: #c62828;
        }

        .booking-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }

        .booking-detail-item {
            display: flex;
            flex-direction: column;
        }

        .booking-detail-label {
            font-size: 12px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
            font-weight: 600;
        }

        .booking-detail-value {
            font-size: 14px;
            font-weight: 500;
        }

        .payment-breakdown {
            background: rgba(0, 0, 0, 0.02);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 20px;
        }

        .payment-breakdown h3 {
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 12px;
            color: var(--text-secondary);
            letter-spacing: 0.5px;
        }

        .payment-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            font-size: 14px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }

        .payment-item:last-child {
            border-bottom: none;
        }

        .payment-label {
            color: var(--text-secondary);
        }

        .payment-amount {
            font-weight: 600;
        }

        .payment-total {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            font-size: 15px;
            font-weight: 700;
            border-top: 2px solid var(--border);
            margin-top: 8px;
        }

        .booking-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-cancel {
            background: rgba(244, 67, 54, 0.1);
            color: #c62828;
        }

        .btn-cancel:hover {
            background: rgba(244, 67, 54, 0.2);
        }

        .btn-cancel:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-copy {
            background: rgba(122, 204, 0, 0.1);
            color: #7acc00;
        }

        .btn-copy:hover {
            background: rgba(122, 204, 0, 0.2);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .empty-state h2 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 40px;
            color: var(--accent);
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
        }

        .back-link:hover {
            opacity: 0.8;
        }

        .cancellation-warning {
            background: rgba(255, 193, 7, 0.1);
            border-left: 3px solid #f57f17;
            padding: 12px;
            border-radius: 4px;
            font-size: 13px;
            color: #6b5100;
            margin-top: 12px;
        }

        @media (max-width: 640px) {
            .dashboard-container {
                margin-top: 60px;
            }

            .dashboard-header h1 {
                font-size: 24px;
            }

            .booking-header {
                flex-direction: column;
            }

            .booking-details {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <nav>
        <div class="nav-left"><a href="index.html" class="nav-logo"><img src="assets/meocy-wordmark-black.png" alt="MEOCY"><span class="nav-logo-sub">Studio</span></a></div>
        <div class="nav-right">
            <ul class="nav-links">
                <li><a href="index.html#about">About</a></li>
                <li><a href="index.html#packages">Packages</a></li>
                <li><a href="index.html#booking">Booking</a></li>
            </ul>
        </div>
    </nav>

    <div class="dashboard-container">
        <a href="index.html" class="back-link">← Back to Home</a>

        <div class="dashboard-header">
            <h1>My Bookings</h1>
            <div class="email-display" id="emailDisplay"></div>
        </div>

        <div id="bookingsContainer"></div>
    </div>

    <script>
        async function loadBookings() {
            const emailInput = prompt('Enter your email to view bookings:');
            if (!emailInput) return;

            document.getElementById('emailDisplay').textContent = `Email: ${emailInput}`;

            try {
                const response = await fetch(`/api/bookings/customer/${encodeURIComponent(emailInput)}`);
                const data = await response.json();

                if (!response.ok) {
                    showEmpty('Unable to load bookings. Please try again.');
                    return;
                }

                if (data.bookings.length === 0) {
                    showEmpty('No bookings found for this email.');
                    return;
                }

                renderBookings(data.bookings);
            } catch (error) {
                console.error('Error loading bookings:', error);
                showEmpty('An error occurred while loading bookings.');
            }
        }

        function showEmpty(message) {
            const container = document.getElementById('bookingsContainer');
            container.innerHTML = `<div class="empty-state"><h2>${message}</h2></div>`;
        }

        function renderBookings(bookings) {
            const container = document.getElementById('bookingsContainer');
            container.innerHTML = '';

            const bookingsList = document.createElement('div');
            bookingsList.className = 'bookings-list';

            bookings.forEach(booking => {
                const card = createBookingCard(booking);
                bookingsList.appendChild(card);
            });

            container.appendChild(bookingsList);
        }

        function createBookingCard(booking) {
            const card = document.createElement('div');
            card.className = 'booking-card';

            const statusClass = booking.is_cancelled ? 'status-cancelled' :
                               booking.payment_status === 'completed' ? 'status-completed' : 'status-pending';
            const statusText = booking.is_cancelled ? 'Cancelled' :
                              booking.payment_status === 'completed' ? 'Completed' : 'Pending';

            const canCancel = booking.can_cancel && !booking.is_cancelled;
            const cancelButtonDisabled = !canCancel;

            card.innerHTML = `
                <div class="booking-header">
                    <div>
                        <div class="booking-id">Booking ID: ${booking.id}</div>
                    </div>
                    <span class="booking-status ${statusClass}">
                        ${statusText}
                    </span>
                </div>

                <div class="booking-details">
                    <div class="booking-detail-item">
                        <div class="booking-detail-label">Package</div>
                        <div class="booking-detail-value">${booking.package}</div>
                    </div>
                    <div class="booking-detail-item">
                        <div class="booking-detail-label">Shoot Type</div>
                        <div class="booking-detail-value">${booking.shoot_type}</div>
                    </div>
                    <div class="booking-detail-item">
                        <div class="booking-detail-label">Booking Date</div>
                        <div class="booking-detail-value">${booking.booking_date}</div>
                    </div>
                    <div class="booking-detail-item">
                        <div class="booking-detail-label">Booking Time</div>
                        <div class="booking-detail-value">${booking.booking_time || 'Not specified'}</div>
                    </div>
                </div>

                <div class="payment-breakdown">
                    <h3>Payment Breakdown</h3>
                    <div class="payment-item">
                        <span class="payment-label">Total Price</span>
                        <span class="payment-amount">€${booking.total_price.toFixed(2)}</span>
                    </div>
                    <div class="payment-item">
                        <span class="payment-label">First Day Withheld (25%)</span>
                        <span class="payment-amount">€${booking.first_day_withheld.toFixed(2)}</span>
                    </div>
                    <div class="payment-item">
                        <span class="payment-label">Remaining Days Withheld (50%)</span>
                        <span class="payment-amount">€${booking.remaining_days_withheld.toFixed(2)}</span>
                    </div>
                    <div class="payment-item">
                        <span class="payment-label">Final Release (25%)</span>
                        <span class="payment-amount">€${booking.final_release.toFixed(2)}</span>
                    </div>
                </div>

                <div class="booking-actions">
                    <button class="btn btn-copy" onclick="copyToClipboard('${booking.id}')">Copy Booking ID</button>
                    ${!booking.is_cancelled ? `
                        <button class="btn btn-cancel" ${cancelButtonDisabled ? 'disabled' : ''} onclick="cancelBooking('${booking.id}')">
                            ${canCancel ? 'Cancel Booking' : 'Cannot Cancel (window closed)'}
                        </button>
                    ` : ''}
                </div>

                ${!booking.is_cancelled && booking.can_cancel_until ? `
                    <div class="cancellation-warning">
                        ⚠️ You can cancel this booking until ${booking.can_cancel_until}
                    </div>
                ` : ''}
            `;

            return card;
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                alert('Booking ID copied to clipboard');
            });
        }

        async function cancelBooking(bookingId) {
            if (!confirm('Are you sure you want to cancel this booking? The withheld amount will be reversed to your account.')) {
                return;
            }

            try {
                const response = await fetch(`/api/bookings/${bookingId}/cancel`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });

                const result = await response.json();

                if (!response.ok) {
                    alert(result.error || 'Failed to cancel booking');
                    return;
                }

                alert(`✅ Booking cancelled successfully!\n\nRefunded amount: €${result.refunded_amount.toFixed(2)}`);
                loadBookings();
            } catch (error) {
                console.error('Error cancelling booking:', error);
                alert('An error occurred while cancelling the booking.');
            }
        }

        window.addEventListener('load', loadBookings);
    </script>
</body>
</html>
